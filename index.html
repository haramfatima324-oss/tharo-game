<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tharo Turbo Racing</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#203c64,#07111e 75%);font-family:system-ui,Arial;color:#fff;text-align:center}header{padding:12px 8px 4px}h1{margin:0;font-size:clamp(24px,5vw,36px);letter-spacing:1px;text-shadow:0 3px 12px #00c8ff77}.sub{color:#9cdaed;font-size:12px;margin:3px}.hud{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:8px auto 10px}.stat{background:#ffffff16;border:1px solid #ffffff35;border-radius:12px;padding:6px 13px;font-size:13px}.stat b{color:#ffe27a;font-size:17px}canvas{display:block;width:min(94vw,400px);height:auto;margin:auto;border:3px solid #a5e8ff;border-radius:15px;box-shadow:0 12px 50px #00bfff30;background:#233}.controls{display:flex;justify-content:center;gap:12px;margin:12px auto;flex-wrap:wrap}button{touch-action:manipulation;cursor:pointer;border:0;border-radius:13px;padding:13px 20px;font-size:16px;font-weight:800;background:linear-gradient(#ffe780,#f9ad27);color:#182337;box-shadow:0 4px 0 #ae6a12}button:active{transform:translateY(3px);box-shadow:0 1px 0 #ae6a12}#restart{background:linear-gradient(#8bf4d1,#29cba0);box-shadow:0 4px 0 #137f66}#sound{background:linear-gradient(#c7d7ff,#8aafff);box-shadow:0 4px 0 #536ea8}.help{font-size:12px;color:#bcd5e8;padding-bottom:18px}
</style></head><body><header><h1>🏎️ THARO TURBO RACING</h1><p class="sub">DODGE TRAFFIC • BEAT YOUR RECORD</p></header><div class="hud"><div class="stat">SCORE <b id="score">0</b></div><div class="stat">BEST <b id="best">0</b></div><div class="stat">LEVEL <b id="level">1</b></div></div><canvas id="game" width="400" height="560" aria-label="Tharo car racing game"></canvas><div class="controls"><button id="left">◀ LEFT</button><button id="restart">↻ RESTART</button><button id="right">RIGHT ▶</button><button id="sound">🔇 SOUND</button></div><p class="help">Use ← → arrow keys or buttons • Avoid traffic • Press Enter to restart</p><script>
'use strict';const canvas=document.getElementById('game'),c=canvas.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),levelEl=document.getElementById('level');const W=400,H=560,roadL=64,roadR=336,lanes=[109,200,291];let best=0;try{best=Number(localStorage.getItem('tharoTurboBest'))||0}catch(e){}bestEl.textContent=best;let player,enemies,score,speed,level,over,last,spawn,offset,raf=0,trees=[],audio=null,soundOn=false;
function tone(freq,dur,type='sine',volume=.04){if(!soundOn)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);g.gain.setValueAtTime(volume,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}catch(e){}}
function reset(){cancelAnimationFrame(raf);player={lane:1,x:200,y:453};enemies=[];score=0;speed=205;level=1;over=false;last=0;spawn=0;offset=0;trees=Array.from({length:12},(_,i)=>({y:i*56-60,side:i%2,kind:i%3}));scoreEl.textContent=0;levelEl.textContent=1;raf=requestAnimationFrame(loop)}
function move(d){if(over)return;const next=Math.max(0,Math.min(2,player.lane+d));if(next!==player.lane){player.lane=next;tone(390,.06,'triangle',.018)}}document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.repeat)return;if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')move(-1);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')move(1);if((e.key==='Enter'||e.key===' ')&&over)reset()});document.getElementById('left').onclick=()=>move(-1);document.getElementById('right').onclick=()=>move(1);document.getElementById('restart').onclick=reset;document.getElementById('sound').onclick=()=>{soundOn=!soundOn;document.getElementById('sound').textContent=soundOn?'🔊 SOUND':'🔇 SOUND';tone(660,.12)};
function rect(x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h)}function round(x,y,w,h,r,col){c.fillStyle=col;c.beginPath();c.roundRect(x,y,w,h,r);c.fill()}
function tree(x,y,kind){c.save();c.translate(x,y);rect(-4,5,8,24,'#745038');c.fillStyle=kind===2?'#1e874d':'#32a45d';for(let j=0;j<3;j++){c.beginPath();c.arc((j-1)*9,-3-(j%2)*8,15,0,Math.PI*2);c.fill()}c.fillStyle='#9df3b2';c.beginPath();c.arc(-8,-12,5,0,Math.PI*2);c.fill();c.restore()}
function car(x,y,color,enemy=false){c.save();c.translate(x,y);c.shadowColor='#0009';c.shadowBlur=12;c.shadowOffsetY=5;round(-21,-40,42,80,12,color);c.shadowBlur=0;c.shadowOffsetY=0;round(-26,-24,8,22,3,'#101521');round(18,-24,8,22,3,'#101521');round(-26,13,8,22,3,'#101521');round(18,13,8,22,3,'#101521');round(-16,-23,32,24,5,'#7ed7ed');round(-14,-20,28,17,4,'#234e75');round(-16,12,32,16,4,'#1b354d');rect(-17,-36,11,5,enemy?'#ffebaa':'#fff4b0');rect(6,-36,11,5,enemy?'#ffebaa':'#fff4b0');rect(-17,32,11,5,'#ff5353');rect(6,32,11,5,'#ff5353');rect(-2,-37,4,68,'#ffffff30');c.restore()}
function draw(){const bg=c.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#277d53');bg.addColorStop(1,'#155238');rect(0,0,W,H,bg);for(const t of trees)tree(t.side?365:34,t.y,t.kind);rect(roadL-10,0,roadR-roadL+20,H,'#858f95');rect(roadL,0,roadR-roadL,H,'#252e3a');for(let y=-50+offset;y<H;y+=85){rect(roadL-9,y,8,37,'#f8fbff');rect(roadR+1,y,8,37,'#f8fbff');rect(154,y,5,43,'#f7e9b0');rect(245,y,5,43,'#f7e9b0')}rect(roadL+5,0,3,H,'#ffffff99');rect(roadR-8,0,3,H,'#ffffff99');for(const e of enemies)car(lanes[e.lane],e.y,e.color,true);car(player.x,player.y,'#ff384e');if(over){rect(0,0,W,H,'#07111dc9');c.textAlign='center';c.fillStyle='#fff';c.font='bold 42px system-ui';c.fillText('GAME OVER',200,230);c.font='bold 23px system-ui';c.fillStyle='#ffe27a';c.fillText('SCORE '+Math.floor(score),200,274);c.font='17px system-ui';c.fillStyle='#e4f3ff';c.fillText('Press RESTART to race again',200,320)}}
function loop(t){if(!last)last=t;const dt=Math.min((t-last)/1000,.05);last=t;if(!over){score+=dt*11;speed=Math.min(420,205+score*.19);const nextLevel=Math.min(10,1+Math.floor(score/90));if(nextLevel!==level){level=nextLevel;levelEl.textContent=level;tone(700,.12)}scoreEl.textContent=Math.floor(score);offset=(offset+speed*dt)%85;player.x+=(lanes[player.lane]-player.x)*Math.min(1,dt*13);for(const tr of trees){tr.y+=speed*dt*.75;if(tr.y>H+35)tr.y=-45}spawn+=dt;const interval=Math.max(.65,1.25-level*.045);if(spawn>=interval){spawn=0;let lane=Math.floor(Math.random()*3);if(enemies.some(e=>e.lane===lane&&e.y<115))lane=(lane+1)%3;enemies.push({lane,y:-55,color:['#fbbf24','#56b6ff','#bc8bff','#fb8b55','#5ce0a0'][Math.floor(Math.random()*5)]})}for(const e of enemies)e.y+=speed*dt;enemies=enemies.filter(e=>e.y<H+55);for(const e of enemies){if(Math.abs(lanes[e.lane]-player.x)<39&&Math.abs(e.y-player.y)<67){over=true;tone(120,.45,'sawtooth',.09);const s=Math.floor(score);if(s>best){best=s;bestEl.textContent=s;try{localStorage.setItem('tharoTurboBest',s)}catch(err){}}break}}}draw();if(!over)raf=requestAnimationFrame(loop)}reset();
</script></body></html>
