<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tharo 2D Car Racing Game</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#101827,#172b28);color:white;font-family:Arial,sans-serif;text-align:center}h1{font-size:clamp(22px,5vw,34px);margin:16px 0 10px}.hud{display:flex;justify-content:center;gap:24px;font-weight:bold;margin-bottom:10px}canvas{display:block;margin:auto;width:min(94vw,400px);height:auto;border:4px solid #f7fafc;border-radius:10px;background:#333;box-shadow:0 8px 35px #0009}.controls{display:flex;justify-content:center;gap:25px;margin:12px}button{border:0;border-radius:12px;background:#ffc533;color:#171717;font-weight:bold;padding:13px 25px;cursor:pointer;font-size:18px;touch-action:none}#restart{background:#65e0a0}.hint{font-size:13px;color:#cbd5e1;margin:8px}
</style>
</head>
<body>
<h1>🏎️ Tharo Car Racing</h1>
<div class="hud"><span>Score: <b id="score">0</b></span><span>Best: <b id="best">0</b></span></div>
<canvas id="game" width="400" height="560" aria-label="Car racing game"></canvas>
<div class="controls"><button id="left">◀ Left</button><button id="restart">Restart</button><button id="right">Right ▶</button></div>
<p class="hint">Use ← → arrow keys or the buttons. Avoid traffic!</p>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
const W=400,H=560,roadL=46,roadR=354,lanes=[98,200,302];
let best=0;try{best=Number(localStorage.getItem('tharoBest'))||0}catch(e){}bestEl.textContent=best;
let player,enemies,score,speed,over,lastTime,spawnTimer,roadOffset,raf;
function reset(){if(raf)cancelAnimationFrame(raf);player={lane:1,y:455};enemies=[];score=0;speed=220;over=false;lastTime=0;spawnTimer=0;roadOffset=0;scoreEl.textContent='0';raf=requestAnimationFrame(loop)}
function move(n){if(!over)player.lane=Math.max(0,Math.min(2,player.lane+n))}
document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(over&&e.key==='Enter')reset()});
document.getElementById('left').onclick=()=>move(-1);document.getElementById('right').onclick=()=>move(1);document.getElementById('restart').onclick=reset;
function car(x,y,color){ctx.save();ctx.translate(x,y);ctx.fillStyle='#111';ctx.fillRect(-26,-23,7,23);ctx.fillRect(19,-23,7,23);ctx.fillRect(-26,14,7,23);ctx.fillRect(19,14,7,23);ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(-21,-39,42,78,9);ctx.fill();ctx.fillStyle='#a8eaff';ctx.fillRect(-15,-21,30,17);ctx.fillStyle='#18324e';ctx.fillRect(-15,13,30,12);ctx.fillStyle='#fff6b3';ctx.fillRect(-17,-36,11,5);ctx.fillRect(6,-36,11,5);ctx.fillStyle='#f44';ctx.fillRect(-17,33,10,4);ctx.fillRect(7,33,10,4);ctx.restore()}
function draw(){ctx.fillStyle='#208345';ctx.fillRect(0,0,W,H);ctx.fillStyle='#34383f';ctx.fillRect(roadL,0,roadR-roadL,H);ctx.fillStyle='#f4f4f4';ctx.fillRect(roadL+5,0,5,H);ctx.fillRect(roadR-10,0,5,H);ctx.fillStyle='#f9fafb';for(let y=-70+roadOffset;y<H;y+=90){ctx.fillRect(148,y,5,44);ctx.fillRect(250,y,5,44)}for(const e of enemies)car(lanes[e.lane],e.y,e.color);car(lanes[player.lane],player.y,'#ff3434');if(over){ctx.fillStyle='#000b';ctx.fillRect(0,0,W,H);ctx.fillStyle='white';ctx.font='bold 38px Arial';ctx.textAlign='center';ctx.fillText('GAME OVER',W/2,H/2-20);ctx.font='20px Arial';ctx.fillText('Score: '+Math.floor(score),W/2,H/2+20);ctx.fillText('Press Restart to play again',W/2,H/2+58)}}
function loop(t){if(!lastTime)lastTime=t;const dt=Math.min((t-lastTime)/1000,.05);lastTime=t;if(!over){speed=Math.min(440,220+score*.16);score+=dt*12;scoreEl.textContent=Math.floor(score);roadOffset=(roadOffset+speed*dt)%90;spawnTimer+=dt;if(spawnTimer>Math.max(.55,1.25-score/1400)){spawnTimer=0;enemies.push({lane:Math.floor(Math.random()*3),y:-55,color:['#ffcc00','#5bc0ff','#db75ff','#ff8956'][Math.floor(Math.random()*4)]})}for(const e of enemies)e.y+=speed*dt;enemies=enemies.filter(e=>e.y<H+55);for(const e of enemies){if(e.lane===player.lane&&Math.abs(e.y-player.y)<72){over=true;const s=Math.floor(score);if(s>best){best=s;bestEl.textContent=best;try{localStorage.setItem('tharoBest',best)}catch(err){}}break}}}draw();if(!over)raf=requestAnimationFrame(loop)}
reset();
</script>
</body>
</html>
